spring.application.name=mutlitenant

spring.datasource.url=${DB_URL:jdbc:h2:mem:mutlitenant;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false

app.tenancy.header-name=X-Tenant-ID
app.tenancy.default-tenant=${APP_TENANCY_DEFAULT_TENANT:public}
app.tenancy.create-schema=true

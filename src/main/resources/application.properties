spring.application.name=multitenant

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/multitenant}
spring.datasource.username=${DB_USERNAME:multitenant}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.default-schema=${APP_TENANCY_DEFAULT_TENANT:public}
spring.flyway.schemas=${APP_TENANCY_DEFAULT_TENANT:public}
spring.flyway.create-schemas=true
spring.flyway.locations=classpath:db/migration

app.tenancy.header-name=X-Tenant-ID
app.tenancy.default-tenant=${APP_TENANCY_DEFAULT_TENANT:public}
app.tenancy.tenant-migration-location=classpath:db/tenant

app.security.jwt-secret=${JWT_SECRET:}
app.security.jwt-issuer=${JWT_ISSUER:multitenant}
app.security.jwt-expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
app.security.platform-admin-token=${PLATFORM_ADMIN_TOKEN:}
app.security.bootstrap-token=${TENANT_BOOTSTRAP_TOKEN:}
spring.application.name=mutlitenant

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mutlitenant}
spring.datasource.username=${DB_USERNAME:mutlitenant}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.default-schema=${APP_TENANCY_DEFAULT_TENANT:public}
spring.flyway.schemas=${APP_TENANCY_DEFAULT_TENANT:public}
spring.flyway.create-schemas=true
spring.flyway.locations=classpath:db/migration

app.tenancy.header-name=X-Tenant-ID
app.tenancy.default-tenant=${APP_TENANCY_DEFAULT_TENANT:public}
app.tenancy.tenant-migration-location=classpath:db/tenant